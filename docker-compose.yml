# Orquestração local: api + redis (storage) + llm-mock (provedor LLM fake)
#
# Uso:
#   cp .env.example .env   (ajuste se quiser)
#   docker compose up --build
#   curl localhost:8000/health
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Sobrepõe o .env: dentro da rede do compose os hosts são os serviços
      REDIS_URL: redis://redis:6379/0
      LLM_BASE_URL: http://llm-mock:8001/v1
    depends_on:
      redis:
        condition: service_healthy
      llm-mock:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  llm-mock:
    build: .
    command: uvicorn services.llm_mock:app --host 0.0.0.0 --port 8001
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
